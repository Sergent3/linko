# Modalità sviluppo con ricaricamento automatico (codice montato dall'host):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build frontend backend worker
# Più lenta: il frontend scarica ~10 MB di JavaScript per pagina, il backend registra ogni query.
services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
  worker:
    build:
      target: development
    environment:
      NODE_ENV: development

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules   # preserva node_modules dal build (non sovrascrivere con host)
      - /app/.next          # preserva cache Next.js
